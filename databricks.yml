# Asset Bundle (no exame de 2026: "Declarative Automation Bundles"): o projeto como código implantável.
# O host NÃO fica aqui (repo público): vem do perfil da Databricks CLI (`databricks auth login`).
bundle:
  name: databricks-nfe-lakehouse

include:
  - resources/*.yml

variables:
  nfe_ldp_id:
    description: id do pipeline nfe_ldp criado pela UI no marco 5 (o bundle referencia, não recria)
    lookup:
      pipeline: nfe_ldp
  pausa_gatilho:
    description: UNPAUSED liga o gatilho de chegada de arquivo; PAUSED deixa só execução manual
    default: PAUSED

targets:
  dev:
    mode: development     # prefixa "[dev <usuário>]" nos nomes e pausa gatilhos: seguro para testar
    default: true
  prod:
    mode: production      # nomes sem prefixo, gatilhos valendo; valida identidade e permissões
    # Sem service principal (Free Edition, identidade pessoal), o modo production exige run_as e permissions
    # explícitos. Em empresa: run_as = service principal.
    # root_path: o padrão (~/.bundle/<bundle>/prod) é restrito ao usuário. /Workspace/Shared foi testado e
    # gera aviso: qualquer usuário poderia alterar o código que o Job executa com as permissões do run_as.
    # Atenção: o estado do bundle mora na root_path; trocá-la sem `bundle destroy` antes duplica os recursos.
    run_as:
      user_name: ${workspace.current_user.userName}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    variables:
      pausa_gatilho: UNPAUSED
