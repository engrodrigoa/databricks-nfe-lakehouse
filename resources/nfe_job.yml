# Job "nfe_job" (marco 6, desenho c, D015)
#
#                ┌► bronze ─► tem_arquivo_novo? ──true──► silver ─► gold ─┐
#  file arrival ─┤                                                         ├─► reconcilia ─► ctrl_lote (ALL_DONE)
#                └► pipeline nfe_ldp ──────────────────────────────────────┘
resources:
  jobs:
    nfe_job:
      name: nfe_job
      description: NF-e ponta a ponta - notebooks e pipeline em paralelo, reconciliação e log de carga
      max_concurrent_runs: 1          # nunca duas cargas ao mesmo tempo sobre os mesmos checkpoints
      trigger:
        pause_status: ${var.pausa_gatilho}
        file_arrival:
          url: /Volumes/workspace/nfe_bronze/landing/xml/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 120   # espera o upload do lote terminar
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/06_jobs/j01_bronze.py
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: tem_arquivo_novo
          depends_on: [{ task_key: bronze }]
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.bronze.values.arquivos_novos}}"
            right: "0"

        - task_key: silver
          depends_on: [{ task_key: tem_arquivo_novo, outcome: "true" }]
          notebook_task:
            notebook_path: ../src/06_jobs/j02_silver.py
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/06_jobs/j03_gold.sql

        - task_key: pipeline
          pipeline_task:
            pipeline_id: ${var.nfe_ldp_id}

        - task_key: reconcilia
          depends_on: [{ task_key: gold }, { task_key: pipeline }]
          notebook_task:
            notebook_path: ../src/06_jobs/j04_reconcilia.py

        - task_key: ctrl_lote
          depends_on:
            - { task_key: bronze }
            - { task_key: tem_arquivo_novo }
            - { task_key: silver }
            - { task_key: gold }
            - { task_key: pipeline }
            - { task_key: reconcilia }
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../src/06_jobs/j05_ctrl_lote.py
            base_parameters:
              run_id: "{{job.run_id}}"
